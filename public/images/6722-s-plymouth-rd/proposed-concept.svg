<text x="28" y="29" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#F5AD1B">PROPOSED / OPTIONAL CONVERSION</text>
<text x="28" y="65" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Five bedrooms and four bathrooms</text>
<text x="28" y="93" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#E2E7DF">Scope concept. The existing-layout renovation and the conversion have separate budgets.</text>
<rect x="28" y="148" width="260" height="228" rx="8" fill="#FFFFFF" stroke="#D5D3CB"/>
<text x="46" y="178" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9C6B08">01</text>
<text x="46" y="208" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#343A40">Renovate the existing home</text>
<text x="46" y="242" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#343A40">Retain the primary above-grade</text>
<text x="46" y="265" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#343A40">footprint as the base project.</text>
<text x="46" y="288" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#343A40">Existing 3 full baths + 1 half.</text>
<text x="46" y="311" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#343A40">Map bedrooms and rooms by floor.</text>
<rect x="319" y="148" width="260" height="228" rx="8" fill="#FFFFFF" stroke="#D5D3CB"/>
<text x="337" y="178" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9C6B08">02</text>
<text x="337" y="208" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#343A40">Evaluate a fifth bedroom</text>
<text x="337" y="242" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#343A40">Study a basement bedroom and</text>
<text x="337" y="265" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#343A40">additional finished space.</text>
<text x="337" y="288" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#343A40">No existing egress windows.</text>
<text x="337" y="311" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#343A40">Evaluate new egress and legal use.</text>
<rect x="610" y="148" width="260" height="228" rx="8" fill="#FFFFFF" stroke="#D5D3CB"/>
<text x="628" y="178" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9C6B08">03</text>
<text x="628" y="208" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#343A40">Resolve bathroom changes</text>
<text x="628" y="242" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#343A40">Existing 3 full baths + 1 half.</text>
<text x="628" y="265" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#343A40">Target four full bathrooms.</text>
<text x="628" y="288" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#343A40">Study expanding the half bath</text>
<text x="628" y="311" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#343A40">or an alternative bathroom location.</text>
<path d="M158,377 L158,405" stroke="#BDA05A" stroke-width="2"/>
<path d="M449,377 L449,405" stroke="#BDA05A" stroke-width="2"/>
<path d="M740,377 L740,405" stroke="#BDA05A" stroke-width="2"/>
<path d="M158,405 L740,405" stroke="#BDA05A" stroke-width="2"/>
