<rect x="28" y="424" width="842" height="83" rx="8" fill="#FFF2CC" stroke="#E4C675"/>
<text x="46" y="452" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#343A40">TARGET ONLY  /  5 bedrooms  /  4 full baths  /  about 3,500 finished sq ft</text>
<text x="46" y="481" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343A40">The area target requires about 450 additional verified finished sq ft. Feasibility is unconfirmed.</text>
<rect x="28" y="525" width="842" height="70" rx="8" fill="#F0F3ED" stroke="#F0F3ED"/>
<text x="46" y="551" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#343A40">Added conversion cost remains unpriced.</text>
<text x="46" y="577" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343A40">Room partitions and stair access need a measured layout before a proposed floor plan can be finalized.</text>
<text x="28" y="624" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#343A40">6722 S Plymouth Rd  |  Dominion Group LLC  |  September 8 2026</text>
<text x="28" y="645" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#343A40">Study only. Not a measured floor plan. Interior room positions remain unverified.</text>
<text x="854" y="644" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#343A40">2</text>
